# Minimal Apache HTTP Server 2.4 configuration for MacCloud
ServerRoot "__SERVER_ROOT__"
Listen 8080

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule unixd_module modules/mod_unixd.so

# Basic settings
ServerName localhost:8080
DocumentRoot "__DOCUMENT_ROOT__"

<Directory "__DOCUMENT_ROOT__">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

DirectoryIndex index.html

# Logging
ErrorLog "__ERROR_LOG__"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog "__ACCESS_LOG__" common

# MIME types
TypesConfig __TYPES_CONFIG__
AddType text/html .html
AddType text/plain .txt

# Security
ServerTokens Prod
ServerSignature Off

# Process management
PidFile "__PID_FILE__"
